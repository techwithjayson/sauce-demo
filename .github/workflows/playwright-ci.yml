name: Playwright CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (part-2)
        working-directory: part-2
        run: npm install

      - name: Install dependencies (part-3)
        working-directory: part-3
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (part-2)
        working-directory: part-2
        run: npm test

      - name: Run Playwright tests (part-3)
        working-directory: part-3
        run: npm test

      - name: List workspace (debug)
        if: always()
        run: |
          echo "Workspace files for debugging artifact uploads"
          ls -R

      - name: Find artifacts (part-2)
        id: find-artifacts-part2
        run: |
          found=false
          if [ -d "part-2/playwright-report" ] || [ -d "part-2/test-results" ]; then
            found=true
          fi
          echo "found=$found" >> $GITHUB_OUTPUT

      - name: Upload Playwright report (part-2)
        if: always() && steps.find-artifacts-part2.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-part-2
          path: |
            part-2/playwright-report
            part-2/test-results

      - name: Find artifacts (part-3)
        id: find-artifacts-part3
        run: |
          found=false
          if [ -d "part-3/playwright-report" ] || [ -d "part-3/test-results" ]; then
            found=true
          fi
          echo "found=$found" >> $GITHUB_OUTPUT

      - name: Upload Playwright report (part-3)
        if: always() && steps.find-artifacts-part3.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-part-3
          path: |
            part-3/playwright-report
            part-3/test-results
